<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi perfil — M1PAES</title>
  <meta name="description" content="Consulta y edición del perfil de usuario en M1PAES.">
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" style="text-decoration:none;color:#fff">M1<span class="accent">PAES</span></a>
    <nav><a href="/">Inicio</a> <a href="#" id="salir">Cerrar sesión</a></nav>
  </header>

  <main>
    <section class="tarjeta">
      <h1>Mi perfil</h1>
      <p class="badge" id="dato-rol">…</p>

      <dl class="datos-usuario">
        <dt>Nombre</dt><dd id="dato-nombre">…</dd>
        <dt>Correo</dt><dd id="dato-correo">…</dd>
        <dt>Suscripción</dt><dd id="dato-suscripcion">…</dd>
        <dt>Fecha de registro</dt><dd id="dato-registro">…</dd>
      </dl>

      <h2>Editar mis datos</h2>
      <form id="perfil-form" class="formulario" novalidate>
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" type="text" maxlength="100" required>

        <label for="correo">Correo electrónico</label>
        <input id="correo" name="correo" type="email" maxlength="150" required>

        <button class="boton" type="submit">Guardar cambios</button>
        <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer>
    <small>M1PAES · Ingeniería de Software · INACAP Maipú (Sección TI3V43)</small>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/perfil.js"></script>
</body>
</html>
